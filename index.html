<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LifeKm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>LifeKm</h1>

<div class="game-container">

    <!-- ESQUERDA -->
    <div class="left-panel">
        <h2>👶 Nascimento</h2>
        <p>Nome: <span id="playerName"></span></p>
        <p>Idade: <span id="age">0</span></p>
        <p>Mãe: <span id="motherName"></span></p>
        <p>Pai: <span id="fatherName"></span></p>

        <h3>👧 Irmãos</h3>
        <div id="siblingsContainer"></div>
    </div>

    <!-- CENTRO -->
    <div class="center-panel">
        <button onclick="ageUp()">Avançar 1 ano</button>
        <button onclick="toggleFamily()">Relacionamentos</button>
    </div>

    <!-- DIREITA -->
    <div class="right-panel">
        <h2>📜 Sua Vida</h2>
        <div id="lifeLog"></div>
    </div>

</div>


<!-- PAINEL FAMÍLIA -->
<div id="familyPanel" style="display: none;" class="section">

    <h3>👨‍👩‍👧 Família</h3>

    <p>👩 Mãe: <span id="motherRelationText"></span></p>
    <div class="bar">
        <div id="motherBar" class="fill"></div>
    </div>

    <p>👨 Pai: <span id="fatherRelationText"></span></p>
    <div class="bar">
        <div id="fatherBar" class="fill"></div>
    </div>

    <button onclick="toggleFamily()">Fechar</button>

</div>

<script src="script.js"></script>

</body>
</html>
