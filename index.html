<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LifeKm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <h1>LifeKm</h1>
    <span id="ageDisplay">0 anos</span>
</header>

<div class="main-content">

    <div class="life-card">
        <h2>📜 Sua Vida</h2>

        <!-- 🔹 Informações de nascimento -->
        <div id="birthInfo" class="birth-info"></div>
        <hr>

        <!-- 🔹 Log da vida -->
        <div id="lifeLog"></div>
    </div>

    <!-- 🔹 Botão envelhecer -->
    <div class="age-button-container">
        <button class="age-circle" onclick="ageUp()">+</button>
        <p>Avançar idade</p>
    </div>

    <!-- 🔹 Status -->
    <div class="status-card">
        <div class="status">
            <label>😊 Felicidade</label>
            <div class="bar"><div id="happinessBar" class="fill" style="width: 60%"></div></div>
        </div>

        <div class="status">
            <label>💪 Saúde</label>
            <div class="bar"><div id="healthBar" class="fill" style="width: 70%"></div></div>
        </div>

        <div class="status">
            <label>🧠 Inteligência</label>
            <div class="bar"><div id="smartsBar" class="fill" style="width: 80%"></div></div>
        </div>
    </div>

</div>

<!-- 🔹 Menu inferior -->
<nav class="bottom-nav">
    <button onclick="toggleFamily()">👨‍👩‍👧 Família</button>
    <button>❤️ Relacionamentos</button>
    <button>💼 Carreira</button>
</nav>

<script src="script.js"></script>

</body>
</html>
