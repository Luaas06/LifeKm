<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LifeKm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <h1>LifeKm</h1>
    <span id="ageDisplay">0 anos</span>
</header>

<div class="main-content">

    <div class="life-card">
        <h2>📜 Sua Vida</h2>
        <div id="lifeLog"></div>
    </div>

    <button class="age-button" onclick="ageUp()">+ Avançar 1 ano</button>

    <div class="status-card">
        <div class="status">
            <label>😊 Felicidade</label>
            <div class="bar"><div class="fill" style="width: 60%"></div></div>
        </div>

        <div class="status">
            <label>💪 Saúde</label>
            <div class="bar"><div class="fill" style="width: 70%"></div></div>
        </div>

        <div class="status">
            <label>🧠 Inteligência</label>
            <div class="bar"><div class="fill" style="width: 80%"></div></div>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button onclick="toggleFamily()">👨‍👩‍👧 Família</button>
    <button>❤️ Relacionamentos</button>
    <button>💼 Carreira</button>
</nav>

<script src="script.js"></script>

</body>
</html>
